name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    # A merge to main is a push to main, so this runs on merged PRs. Skip the
    # version-bump commit this workflow pushes back, so it can't loop (this only
    # matters if a PAT is used later instead of the GITHUB_TOKEN).
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate custom elements manifest
        run: pnpm analyze

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --message "chore(release): %s"

      - name: Push version bump to main
        run: git push origin HEAD:main --follow-tags

      - name: Publish
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
