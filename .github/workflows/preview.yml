name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# pr-preview-action has to commit previews onto gh-pages, so the workflow
# needs write access even though `pull_request` from same-repo branches
# would normally be read-only by default.
permissions:
  contents: write
  pull-requests: write

# All gh-pages writes (previews and the main deploy in pages.yml) share one
# concurrency group so they are serialized and can never race each other.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # When the PR is closed, action: remove skips the deploy entirely,
      # so we don't need to build anything in that case.
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build component
        if: github.event.action != 'closed'
        run: pnpm run build

      - name: Build demo page
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          pnpm rollup -c --file _site/typeahead.bundled.js
          cp pages/index.html _site/index.html
          touch _site/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Wait for the Pages deployment so the sticky comment is only posted
          # once the preview URL actually resolves. Requires GitHub Pages to
          # serve the gh-pages branch (Settings > Pages), otherwise the action
          # times out waiting for a deployment that never starts.
          wait-for-pages-deployment: true
