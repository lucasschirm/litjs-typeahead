name: Deploy demo to GitHub Pages

on:
  # A pull request merged into main produces a push to main.
  push:
    branches: [main]
  workflow_dispatch:

# The pr-preview-action needs to commit previews into the gh-pages branch,
# so this workflow also needs write access on main-branch runs.
permissions:
  contents: write

# All gh-pages writes (this deploy and the PR previews in preview.yml) share
# one concurrency group so they are serialized and can never race each other.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build component
        run: pnpm run build

      - name: Build demo page
        run: |
          mkdir -p _site
          pnpm rollup -c --file _site/typeahead.bundled.js
          cp pages/index.html _site/index.html
          # Pages deploys this branch with Jekyll by default; a .nojekyll at the
          # site root keeps the static demo served exactly as built.
          touch _site/.nojekyll

      # Deploy by pushing _site onto the gh-pages branch. The pr-preview-action
      # lives alongside this on the same branch and uses `pr-preview/` as an
      # umbrella dir; we must exclude that path so main deploys never wipe the
      # in-flight previews.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          # Rebase onto any preview commits instead of force-pushing, so an
          # in-flight pr-preview-action deploy is never overwritten. This is
          # also why single-commit is not used (single-commit orphans the
          # branch and effectively requires a force-push).
          force: false
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
